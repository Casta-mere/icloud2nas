services:
  icloud2nas:
    # The published image (linux/amd64 + linux/arm64). I2N_TAG in .env pins a version.
    # To build locally instead, run `make image` and use `image: icloud2nas:local`.
    image: ghcr.io/casta-mere/icloud2nas:${I2N_TAG:-latest}
    container_name: icloud2nas
    restart: unless-stopped
    ports:
      - "4871:4871"
    volumes:
      - ./data:/data
      - ${PHOTOS_ROOT:?set PHOTOS_ROOT in .env}:/photos
      - /etc:/host/etc:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Single-user mode: run everything as one NAS user (both must be set).
      # Leave unset to run as root with a per-account file owner.
      # PUID: ${PUID}
      # PGID: ${PGID}
