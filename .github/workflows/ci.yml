name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the dev image
        run: make build
      - name: uv.lock is up to date
        run: docker compose run --rm -T dev uv sync --locked
      - name: Lint, typecheck, tests
        run: make check DC_FLAGS=-T
      - name: ShellCheck
        run: find docker scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the web container as the runner user
        run: |
          echo "I2N_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "I2N_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Install
        run: make web-install DC_FLAGS=-T
      - name: Typecheck, lint, tests
        run: make web-check DC_FLAGS=-T

  release-guard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches pyproject.toml version
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          ref = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as f:
              v = tomllib.load(f)["project"]["version"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", ref) or ref[1:] != v:
              print(f"::error::tag {ref} does not match pyproject.toml version {v}")
              sys.exit(1)
          print(f"tag {ref} matches pyproject.toml version {v}")
          PY

  # One native build per platform, pushed by digest; `publish` joins them under the tags.
  image:
    needs: [python, web, release-guard]
    # release-guard is skipped on non-tag runs; build anyway unless something failed.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # tags/flavor must stay identical to the publish job's: they set the version label.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/casta-mere/icloud2nas
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/casta-mere/icloud2nas,push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - if: github.event_name == 'push'
        name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    if: ${{ github.event_name == 'push' && !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # tags/flavor must stay identical to the image job's.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/casta-mere/icloud2nas
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            if [ -n "$annotation" ]; then args+=(--annotation "$annotation"); fi
          done <<< "$ANNOTATIONS"
          for digest in *; do
            args+=("ghcr.io/casta-mere/icloud2nas@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
      - name: Check both platforms are published
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          first=$(head -n 1 <<< "$TAGS")
          out=$(docker buildx imagetools inspect "$first")
          printf '%s\n' "$out"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -qF "$platform" <<< "$out"; then
              echo "::error::$first has no $platform image"
              exit 1
            fi
          done

  # A GitHub Release for a version tag, once its image is published. A re-run (the release already
  # exists) leaves it alone. The page is a Summary (each released pull request's `## Release notes`
  # section, see docs/release.md), the image tags, then GitHub's generated notes. Pull request
  # bodies are untrusted: they only pass from `gh` to scripts/release_notes.py through a pipe.
  # tests/test_ci_release.py runs this script against a fake `gh`.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ needs.publish.outputs.tags }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          if [ -z "$TAGS" ]; then
            echo "::error::publish reported no image tags"
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          generated="$RUNNER_TEMP/generated-notes.md"
          summary="$RUNNER_TEMP/summary.md"
          section="$RUNNER_TEMP/section.md"
          deploy="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/deploy.md"
          # The pull requests merged since the previous Release, as --generate-notes lists them.
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > "$generated"
          prs=$(python3 scripts/release_notes.py prs --server-url "$GITHUB_SERVER_URL" \
            --repo "$GITHUB_REPOSITORY" < "$generated")
          : > "$summary"
          # $prs is digits and newlines only, so splitting it is safe.
          for pr in $prs; do
            gh api "repos/$GH_REPO/pulls/$pr" --jq '.body // ""' \
              | python3 scripts/release_notes.py section > "$section"
            if [ -s "$section" ]; then
              { cat "$section"; printf '\n'; } >> "$summary"
            fi
          done
          # The backticks in these single-quoted formats are Markdown code spans.
          # shellcheck disable=SC2016
          {
            if [ -s "$summary" ]; then
              printf '## Summary\n\n'
              cat "$summary"
            fi
            printf '## Image\n\nFor `linux/amd64` and `linux/arm64`:\n\n'
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then printf -- '- `%s`\n' "$tag"; fi
            done <<< "$TAGS"
            printf '\nUpdate a host with `docker compose pull && docker compose up -d`. To stay on '
            printf 'this version, set `I2N_TAG=%s` in `.env`; see [docs/deploy.md](%s).\n' \
              "${GITHUB_REF_NAME#v}" "$deploy"
            printf '\n'
            cat "$generated"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$notes"
