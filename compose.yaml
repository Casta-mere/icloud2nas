services:
  dev:
    build:
      context: .
      target: dev
    image: icloud2nas-dev
    working_dir: /app
    volumes:
      - .:/app
      - venv:/opt/venv
      - uv-cache:/root/.cache/uv
      - ./.probe:/probe
    environment:
      TZ: Asia/Shanghai
    stdin_open: true
    tty: true

volumes:
  venv:
  uv-cache:
