[project]
name = "icloud2nas"
version = "0.0.1"
description = "Mirror a household's iCloud Photos libraries to a NAS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "icloudpd==1.32.3",
  "sqlalchemy>=2.0.36",
  "cryptography>=43.0",
]

[project.scripts]
icloud2nas-worker = "icloud2nas.worker:cli"
icloud2nas-ctl = "icloud2nas.ctl:cli"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud2nas"]

[tool.uv.sources]
icloudpd = { url = "https://files.pythonhosted.org/packages/b9/73/20544e68569fce262d596ebe42730aac235b8e69a36edefebdf8cfa85508/icloudpd-1.32.3-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["icloud2nas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-q"
asyncio_mode = "auto"
